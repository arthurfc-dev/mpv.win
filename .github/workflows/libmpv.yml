name: Build pinned libmpv

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libmpv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile libmpv and preserve sources
        shell: bash
        run: |
          set -euo pipefail
          image=$(python3 -c 'import json; print(json.load(open("dependencies/libmpv-build.json"))["container"])')
          mkdir -p artifacts/libmpv
          docker pull "$image"
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD:/project:ro" -v "$PWD/artifacts/libmpv:/output" \
            "$image" -c 'mkdir -p /build; python3 /project/scripts/build-libmpv.py' \
            2>&1 | tee artifacts/libmpv/build.log
      - name: Archive complete output including Cargo checksum files
        if: always()
        shell: bash
        run: sudo tar -czf artifacts/libmpv.tar.gz -C artifacts/libmpv .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: libmpv-build-${{ github.run_id }}
          path: artifacts/libmpv.tar.gz
          retention-days: 30
          if-no-files-found: error
