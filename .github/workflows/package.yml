name: Prepare Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Compile application and restore verified notices
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\build.ps1 -Configuration Release -OutputDirectory .local/release-app
      - name: Compile installer
        shell: powershell
        run: .\scripts\build-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mpv-win-windows-x64-setup
          path: artifacts/setup/*
          retention-days: 30
          if-no-files-found: error
      - name: Record scope
        shell: pwsh
        run: |
          'Installer compiled and checksummed. This workflow neither installs the app nor publishes a release. Installed-app acceptance and distribution review remain separate.' >> $env:GITHUB_STEP_SUMMARY
